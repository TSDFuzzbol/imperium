  <!-- ================= LUZ E ACABAMENTO ================= -->
  <g id="luz-vela" style="mix-blend-mode:soft-light">
    <rect width="600" height="800" fill="url(#sob-vela)"/>
  </g>
  <rect id="vinheta" width="600" height="800" fill="url(#sob-vinheta)"/>
  <rect id="pinceladas" width="600" height="800" filter="url(#sob-pinceladas)" opacity=".16" style="mix-blend-mode:soft-light"/>
  <rect id="grao" width="600" height="800" filter="url(#sob-grao)" opacity=".07" style="mix-blend-mode:overlay"/>
  </g>
</svg>
