        <path id="labio-sup" d="M276 423 C285 416 293 413 300 416 C307 413 315 416 324 423 C313 421 306 420 300 421 C294 420 287 421 276 423 Z" fill="#8a5044"/>
        <g id="labio-inf">
          <path d="M279 425 C287 437 313 437 321 425 C312 428 288 428 279 425 Z" fill="#a8675a"/>
          <ellipse cx="295" cy="431" rx="8" ry="2.2" fill="#e8b49c" opacity=".55" filter="url(#sob-b2)"/>
